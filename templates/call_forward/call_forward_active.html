<div
	hx-trigger="every 1m"
	hx-get="/web/call-forward/{{ fwd.fwd_id }}/active_display"
	hx-target="this"
	hx-swap="outerHTML">
{% if fwd.timeframes.len() > 0 %}
{% if fwd.most_specific_active_timeframe().is_some() %}
	<div class="td flex justify-center text-lime-400 w-20">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-12">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
		<div>({{fwd.timeframes.len()}})</div>
	</div>
{% else %}
	<div class="td flex justify-center text-neutral-200 w-20">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-12">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
		<div>({{fwd.timeframes.len()}})</div>
	</div>
{% endif %}
{% endif %}
</div>
