<div class="tr flex w-full justify-evenly border-2 border-zinc-400 p-2 {% if timeframe.currently_active() %} text-lime-400 {% else %} text-neutral-200 {% endif %}">
	{{ timeframe.inner_display() }}
  <div class="td flex w-36 justify-center">
		<button hx-get="/web/timeframe/{{ timeframe.type_name() }}/{{ timeframe.id() }}/edit" hx-target="closest div.tr" hx-swap="outerHTML" hx-indicator="#indicator-from-show-{{ timeframe.type_name() }}-{{ timeframe.id() }}" class="h-12 w-12 rounded-lg bg-neutral-800 hover:rounded-2xl hover:bg-neutral-600 text-sky-300">
      <svg class="translate-x-2" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" /></svg>
    </button>
		<button hx-delete="/web/timeframe/{{ timeframe.type_name() }}/{{ timeframe.id() }}/delete" hx-target="closest div.tr" hx-swap="outerHTML" hx-indicator="#indicator-from-show-{{ timeframe.type_name() }}-{{ timeframe.id() }}" class="h-12 w-12 rounded-lg bg-red-600/70 hover:rounded-2xl hover:bg-red-600/90 text-sky-300">
      <svg class="h-8 w-8 translate-x-2 text-neutral-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </svg>
    </button>
		<div class="htmx-indicator text-surface inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-e-transparent align-[-0.125em] motion-reduce:animate-[spin_1.5s_linear_infinite]" id="indicator-from-show-{{ timeframe.type_name() }}-{{ timeframe.id() }}">
      <span class="!absolute !-m-px !h-px !w-px !overflow-hidden !border-0 !p-0 !whitespace-nowrap ![clip:rect(0,0,0,0)]">Lade.</span>
    </div>
  </div>
</div>
